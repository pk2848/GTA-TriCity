name: Build GTA-TriCity

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check offline map builder syntax
        run: node --check scripts/build-offline-map.mjs
      - name: Build production assets
        run: npm run build
