name: Build GTA-TriCity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production assets
        run: npm run build
